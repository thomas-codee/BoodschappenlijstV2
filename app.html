<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>De Recepten Raket!</title>

<link rel="icon" type="image/png" href="logo.png">
<link rel="apple-touch-icon" href="logo.png">
<meta name="theme-color" content="#5cb377">

<style>
@import url('https://fonts.googleapis.com/css2?family=Cabin+Sketch:wght@400;700&family=Kalam:wght@300;400;700&display=swap');

:root{
  --color-primary: #5cb377;
  --color-secondary: #ff6347;
  --color-background: #fdf6e3;
  --color-text: #2c3e50;
  --font-heading: 'Cabin Sketch', cursive;
  --font-body: 'Kalam', cursive;
}

body{
  font-family: var(--font-body);
  display: flex;
  flex-direction: column;
  padding: 20px;
  background-color: var(--color-background);
  color: var(--color-text);
  min-height: 100vh;
  gap: 20px;
}

@media (min-width: 768px){
  body{ flex-direction: row; align-items: flex-start; gap: 40px; }
}

h2{
  font-family: var(--font-heading);
  color: var(--color-secondary);
  margin-top: 0;
  margin-bottom: 20px;
  font-size: 2.2em;
  text-shadow: 2px 2px 0 rgba(0,0,0,0.1);
  border-bottom: 3px dashed var(--color-primary);
  padding-bottom: 10px;
  position: relative;
}

h2 img.logo-header{
  position: absolute;
  top: 0;
  right: 0;
  width: 40px;
  height: 40px;
}

.controls, .shopping-list{
  background: #fff;
  padding: 20px;
  border-radius: 20px;
  border: 3px solid var(--color-text);
}

.controls{
  flex: 1;
  max-width: 100%;
  box-shadow: 6px 6px 0 var(--color-primary);
}

.shopping-list{
  flex: 2;
  min-width: 250px;
  display: flex;
  flex-direction: column;
  position: relative;
  padding-bottom: 200px; /* ruimte voor decoratieve afbeelding */
  box-shadow: -8px 8px 0 var(--color-secondary);
}

label{
  font-weight: 700;
  display: block;
  margin-top: 15px;
  margin-bottom: 5px;
  font-size: 1.05em;
}

input[type="text"], button{
  font-family: var(--font-body);
  width: 100%;
  padding: 10px;
  margin-bottom: 12px;
  font-size: 1em;
  border: 3px solid var(--color-text);
  border-radius: 10px;
  box-sizing: border-box;
  background-color: #fffaf0;
}

input[type="text"]:focus{
  border-color: var(--color-secondary);
  box-shadow: 3px 3px 0 var(--color-secondary);
  outline: none;
}

button{
  background-color: var(--color-primary);
  color: white;
  border: 3px solid var(--color-text);
  cursor: pointer;
  font-weight: bold;
  letter-spacing: 1px;
  margin-top: 10px;
  box-shadow: 4px 4px 0 var(--color-text);
  transition: all .1s ease;
}

button:hover{
  background-color: #4ca067;
  transform: translate(2px,2px);
  box-shadow: 2px 2px 0 var(--color-text);
}

.shopping-list .section{
  margin-bottom: 15px;
  padding-bottom: 8px;
  border-bottom: 2px dotted var(--color-primary);
}

.shopping-list .section:last-child{ border-bottom: none; }

.shopping-list strong{
  font-family: var(--font-heading);
  font-size: 1.3em;
  color: var(--color-primary);
}

.shopping-list ul{
  list-style: none;
  padding: 0;
  margin: 8px 0 0 0;
}

.shopping-list li{
  padding: 5px 0;
  border-bottom: 1px solid #eee;
  margin-left: 10px;
  position: relative;
}

.shopping-list li::before{
  content: '★';
  color: var(--color-secondary);
  font-size: 1em;
  position: absolute;
  left: -20px;
}

/* kleiner decoratief plaatje */
.shopping-list-image{
  position: absolute;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%) rotate(-3deg);
  width: 120px;
  height: auto;
  opacity: 0.9;
  z-index: 1;
  pointer-events: none;
  background: white;
  padding: 10px 10px 30px 10px;
  border: 1px solid #ccc;
  box-shadow: 4px 4px 12px rgba(0,0,0,0.2);
}

.check-item{
  display: flex;
  align-items: center;
  gap: 10px;
  cursor: pointer;
}

.item-checkbox{ transform: scale(1.3); accent-color: var(--color-primary); cursor: pointer; }

.item-text{
  transition: background-color .3s, color .3s;
  padding: 3px 6px;
  border-radius: 8px;
}
.item-text.checked{
  background-color: #b4e0b4;
  color: #2c3e50;
  text-decoration: line-through;
}

/* EXPORT knop - kleiner en rechts uitlijnen */
#export{
  margin-top: 10px;
  margin-left: auto;      /* dwingt de knop naar rechts */
  display: none;          /* zichtbaar na generate */
  font-size: 0.78rem;     /* kleiner lettertype */
  padding: 6px 10px;      /* kleinere padding */
  height: auto;
  line-height: 1;
  border-radius: 8px;
}

/* mobile adjustments */
@media (max-width: 767px){
  .shopping-list{ padding-bottom: 250px; padding-top: 12px; }
  .shopping-list-image{ bottom: 20px; width: 100px; }
  #export{ font-size: 0.75rem; padding: 5px 8px; }
}
</style>
</head>
<body>

<div class="controls">
  <h2>Selecteer Je Maaltijden!</h2>

  <label for="day1">Maandag</label>
  <input type="text" list="day1List" id="day1" placeholder="Kies een recept..."><datalist id="day1List"></datalist>

  <label for="day2">Dinsdag</label>
  <input type="text" list="day2List" id="day2" placeholder="Kies een recept..."><datalist id="day2List"></datalist>

  <label for="day3">Woensdag</label>
  <input type="text" list="day3List" id="day3" placeholder="Kies een recept..."><datalist id="day3List"></datalist>

  <label for="day4">Donderdag</label>
  <input type="text" list="day4List" id="day4" placeholder="Kies een recept..."><datalist id="day4List"></datalist>

  <label for="day5">Vrijdag</label>
  <input type="text" list="day5List" id="day5" placeholder="Kies een recept..."><datalist id="day5List"></datalist>

  <label for="day6">Zaterdag</label>
  <input type="text" list="day6List" id="day6" placeholder="Kies een recept..."><datalist id="day6List"></datalist>

  <label for="day7">Zondag</label>
  <input type="text" list="day7List" id="day7" placeholder="Kies een recept..."><datalist id="day7List"></datalist>

  <button id="generate">GO! Maak de Boodschappenlijst!</button>
</div>

<div class="shopping-list">
  <h2>Boodschappenlijst! <img src="logo.png" alt="Logo" class="logo-header"></h2>
  <div class="list-items-container" id="list"></div>
  <button id="export">📄 Exporteer</button>
  <img src="picture.jpg" alt="Decoratieve afbeelding" class="shopping-list-image">
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
document.addEventListener("DOMContentLoaded", () => {

  /* ---------- SUPABASE SETUP ---------- */
  const supabaseUrl = "https://rtqfjlbgnftlznonecwj.supabase.co";
  const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ0cWZqbGJnbmZ0bHpub25lY3dqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjIwNjY1ODgsImV4cCI6MjA3NzY0MjU4OH0.hWcsqknprKIuA0AGnUn1cOM4ux0U-rgyWNJxp3vTS_U";
  const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

  /* ---------- GLOBAL VARIABLES ---------- */
  let recipes = {};
  let checkedItems = {};

  /* ---------- AUTH CHECK ---------- */
  (async () => {
    const { data: { session } } = await supabase.auth.getSession();
    if (!session) {
      window.location.href = "index.html";
      return;
    }
    window.currentUser = session.user;
    console.log("Ingelogd als:", window.currentUser.email);
    await loadRecipes();
  })();

  /* ---------- LOGOUT - REMOVED: NO #logout element in HTML ---------- */

  /* ---------- LOAD RECIPES ---------- */
  async function loadRecipes() {
    const { data, error } = await supabase
      .from("recipes")
      .select("*")
      .eq("user_id", window.currentUser.id)
      .order("created_at", { ascending: true });

    if (error) {
      console.error("Fout bij laden recepten:", error);
      alert("Kon recepten niet laden!");
      return;
    }

    recipes = {};
    data.forEach(r => { recipes[r.name] = r.data; });
    console.log("Recepten geladen:", recipes);
    initUI();
  }

  window.loadRecipes = loadRecipes;

  /* ---------- UI BOUWEN - SIMPLIFIED TO ONLY POPULATE DATALISTS ---------- */
  function initUI() {
    const recipeNames = Object.keys(recipes);
    // const recipeInputs = document.getElementById("recipe-inputs"); // THIS CAUSED THE ERROR
    // recipeInputs.innerHTML = ""; // THIS CAUSED THE ERROR

    const days = ["day1List","day2List","day3List","day4List","day5List","day6List","day7List"];

    days.forEach(datalistId => {
      const datalist = document.getElementById(datalistId);
      if (datalist) { // Add a check for safety
        datalist.innerHTML = ""; // Clear existing options
        recipeNames.forEach(name => {
          const opt = document.createElement("option");
          opt.value = name;
          datalist.appendChild(opt);
        });
      }
    });
  }

  /* ---------- GENERATE SHOPPING LIST ---------- */
  function generateList() {
    const days = ["day1","day2","day3","day4","day5","day6","day7"];
    const selected = days.map(d => document.getElementById(d)?.value.trim() || "Geen");
    const aggregated = {};
// ... rest of generateList function is unchanged
    selected.forEach(r => {
      if (r === "Geen" || !recipes[r]) return;
      recipes[r].forEach(item => {
        const key = item.name + " (" + item.unit + ")";
        if (!aggregated[item.category]) aggregated[item.category] = {};
        if (!aggregated[item.category][key]) aggregated[item.category][key] = 0;
        aggregated[item.category][key] += item.amount;
      });
    });

    let html = "";
    Object.keys(aggregated).forEach(cat => {
      html += `<div class="section"><strong>${cat}</strong><ul>`;
      Object.keys(aggregated[cat]).forEach(k => {
        const unitMatch = k.match(/\((.*)\)/);
        const unit = unitMatch ? unitMatch[1] : '';
        const id = k.replace(/\s+/g,'_');
        const checked = checkedItems[id] ? 'checked' : '';
        const textClass = checkedItems[id] ? 'item-text checked' : 'item-text';
        html += `<li class="check-item">
                   <input type="checkbox" class="item-checkbox" data-id="${id}" ${checked}>
                   <span class="${textClass}" id="${id}">${k.split(" (")[0]}: ${aggregated[cat][k]} ${unit}</span>
                 </li>`;
      });
      html += "</ul></div>";
    });

    document.getElementById("list").innerHTML = html;
    document.getElementById("export").style.display = "block";

    document.querySelectorAll(".item-checkbox").forEach(cb => {
      cb.addEventListener("change", () => {
        const id = cb.dataset.id;
        const textEl = document.getElementById(id);
        if (cb.checked) {
          textEl.classList.add("checked");
          checkedItems[id] = true;
        } else {
          textEl.classList.remove("checked");
          delete checkedItems[id];
        }
      });
    });
  }

  document.getElementById("generate").addEventListener("click", generateList);

  /* ---------- EXPORT ---------- */
  document.getElementById("export").addEventListener("click", () => {
    const items = Array.from(document.querySelectorAll(".item-text"))
      .filter(i => !i.classList.contains("checked"))
      .map(i => i.textContent)
      .join("\n");
    const blob = new Blob([items], { type: "text/plain" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "boodschappenlijst.txt";
    a.click();
  });

});
</script>
<!-- ➕ Plusknop rechtsonder -->
<button id="addRecipeBtn" title="Nieuw recept toevoegen">＋</button>

<!-- Logout knop -->
<button id="logoutBtn" title="Uitloggen">⏏</button>


<style>
#addRecipeBtn {
  position: fixed;
  bottom: 30px;
  right: 30px;
  width: 60px;
  height: 60px;
  border-radius: 50%;
  font-size: 2em;
  font-weight: bold;
  background-color: var(--color-primary);
  color: white;
  border: 3px solid var(--color-text);
  box-shadow: 6px 6px 0 var(--color-text);
  cursor: pointer;
  transition: all 0.1s ease;
}
#addRecipeBtn:hover {
  transform: translate(2px, 2px);
  box-shadow: 3px 3px 0 var(--color-text);
}
#logoutBtn {
  position: fixed;
  top: 30px;
  right: 30px;  /* past goed naast de plusknop als je wilt */
  width: 60px;
  height: 60px;
  border-radius: 50%;
  font-size: 1.8em;
  font-weight: bold;
  background-color: var(--color-secondary);
  color: white;
  border: 3px solid var(--color-text);
  box-shadow: 6px 6px 0 var(--color-text);
  cursor: pointer;
  transition: all 0.1s ease;
  z-index: 1000; /* altijd boven andere content */
}

#logoutBtn:hover {
  transform: translate(2px, 2px);
  box-shadow: 3px 3px 0 var(--color-text);
}
</style>

<script>
  
document.getElementById("addRecipeBtn").addEventListener("click", () => {
  window.location.href = "nieuw-recept.html";
});
document.getElementById("logoutBtn").addEventListener("click", async () => {
  try {
    const { error } = await supabase.auth.signOut();
    if (error) {
      alert("Uitloggen mislukt: " + error.message);
    } else {
      window.location.href = "index.html";
    }
  } catch (err) {
    console.error("Logout error:", err);
    alert("Er is iets misgegaan bij het uitloggen.");
  }
});

</script>
</body>
</html>
